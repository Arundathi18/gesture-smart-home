# Local MQTT broker for the gesture smart home. Run: mosquitto -c mosquitto.conf
# Anyone on the home WiFi can connect; nothing is reachable from the internet.
allow_anonymous true
persistence false

# ESP32 and Python scripts
listener 1883 0.0.0.0
protocol mqtt

# Web dashboard (phones connect from the browser)
listener 9001 0.0.0.0
protocol websockets
